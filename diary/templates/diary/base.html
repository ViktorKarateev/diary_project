<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Дневник{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навбар с кнопкой выхода -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <span class="navbar-brand">Личный дневник</span>
            <div class="d-flex ms-auto">
                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
                </form>
                {% else %}
                <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Контейнер для остального содержимого -->
    <div class="container mt-4">
        <h1 class="mb-4">{% block header %}Личный дневник{% endblock %}</h1>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
